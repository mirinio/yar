name: Release

# Pushing a tag such as v0.3.0 builds the self-contained tarball and publishes it as a
# GitHub release, with the matching section of CHANGELOG.md as its notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

      - name: The tag matches the version in Directory.Build.props
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: scripts/publish.sh linux-x64

      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No section for $VERSION in CHANGELOG.md"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Yar $VERSION" --notes-file notes.md \
            "artifacts/dist/yar-$VERSION-linux-x64.tar.gz" "artifacts/dist/yar-$VERSION-linux-x64.tar.gz.sha256"
